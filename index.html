<!-- CONTACT SECTION -->
    <section id="contact">
      <div class="contact-layout">
        <div class="contact-left">
          <h2>Let’s connect.</h2>
          <p>I’m open to internships, collaborations, hackathons, and software projects in web, cloud, or AI. Reach out if you want to discuss an opportunity.</p>
        </div>
        <div class="contact-form-card">
          <form action="mailto:vennelakonduru93@gmail.com" method="post" enctype="text/plain">
            <div class="form-group">
              <label>Name</label>
              <input type="text" name="name" placeholder="Your name" required>
            </div>
            <div class="form-group">
              <label>Email</label>
              <input type="email" name="email" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
              <label>Message</label>
              <textarea name="message" rows="4" placeholder="Tell me about your project" required></textarea>
            </div>
            <button type="submit" class="submit-btn">Send Message</button>
          </form>
        </div>
      </div>
    </section>
